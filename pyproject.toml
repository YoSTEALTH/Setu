[tool.pytest.ini_options]
pythonpath = ["test"]  # after `zig build develop`, tests run straight from the checkout
testpaths = ["test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.format]
quote-style = "preserve"

# Setu's docs site (`python3 tool/setu_doc.py`, after `zig build develop`; `serve` for Run): the README, the
# guide, the test extension `setu_class` as the API Setu generates, and Setu's coverage and profile. `name` is also
# what a project's site calls Setu (its Coverage page, Setu as a dependency).
[tool.setu_doc]
name = 'Setu'
version = 'build.zig.zon'  # Setu's version, not `setu_class`' placeholder `0.0`
module = 'setu_class'
path = ['test']
stub = 'test/setu_class.pyi'
summary = 'Zig <-> CPython bindings: one binary for CPython 3.14, 3.14t, 3.15, 3.15t and later.'
out = 'zig-out/site'
home = 'README.md'
edit = 'https://github.com/YoSTEALTH/Setu/edit/dev/'
repo = 'https://github.com/YoSTEALTH/Setu'
coverage = 'zig-out/coverage.json'  # `zig build coverage`
coverage_history = 'doc/coverage-history.json'  # its `.history`, committed
profile = 'zig-out/profile.json'  # `zig build profile -Doptimize=fast -Dcpu=x86_64_v3`

[[tool.setu_doc.markdown]]
file = 'doc/setu-guide.md'
title = 'Writing an extension'
section = 'Guide'
split = true  # a page per chapter

[[tool.setu_doc.pages]]
slug = 'functions'
title = 'Functions'
text = "`setu_class`' module functions: every parameter type Setu converts, as Python sees it."
sources = ['test/function.zig']

[[tool.setu_doc.pages]]
slug = 'classes'
title = 'Classes'
text = 'A `setu.Class` per hook family: what Setu generates for each.'
default = true

[[tool.setu_doc.pages]]
slug = 'constants'
title = 'Constants'
text = 'Typed module constants.'
constants = true
