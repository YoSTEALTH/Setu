name: ci

# Push to dev first; merge/push to main only after this passes.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04  # the newest; its kcov package (25.04+) runs `zig build coverage`
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Python 3.15t (free-threaded)
        id: py_ft
        uses: actions/setup-python@v7
        with:
          python-version: 3.15t
          allow-prereleases: true

      - name: Python 3.15 (GIL)
        id: py_gil
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Python 3.14t (free-threaded)
        id: py314_ft
        uses: actions/setup-python@v7
        with:
          python-version: 3.14t

      - name: Python 3.14 (GIL)
        id: py314_gil
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # latest pip on every interpreter: `check_wheels.py` pip-installs the wheels (older pips work too)
      - name: Install tools
        run: |
          "${{ steps.py_ft.outputs.python-path }}" -m pip install -U pip pytest ruff mypy
          "${{ steps.py_gil.outputs.python-path }}" -m pip install -U pip pytest
          "${{ steps.py314_ft.outputs.python-path }}" -m pip install -U pip pytest
          "${{ steps.py314_gil.outputs.python-path }}" -m pip install -U pip pytest

      # `check_docs.py` runs the docs site's app.js with its docs.wasm in deno (test/docs/app_test.js)
      - name: deno
        uses: denoland/setup-deno@v2

      - name: tools/check.sh
        env:
          PY_FT: ${{ steps.py_ft.outputs.python-path }}
          PY_GIL: ${{ steps.py_gil.outputs.python-path }}
          PY314_FT: ${{ steps.py314_ft.outputs.python-path }}
          PY314_GIL: ${{ steps.py314_gil.outputs.python-path }}
        run: tools/check.sh

      # Line coverage on all four interpreters, merged; the committed README badge must match what this run writes
      # (`zig build coverage` with every `--python` locally, then commit `docs/coverage-badge.json` and
      # `docs/coverage-history.json`).
      - name: kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: zig build coverage
        run: >-
          zig build coverage -Dpython="${{ steps.py_ft.outputs.python-path }}" --
          --python "${{ steps.py_gil.outputs.python-path }}"
          --python "${{ steps.py314_ft.outputs.python-path }}"
          --python "${{ steps.py314_gil.outputs.python-path }}"

      - name: coverage badge and history up to date
        run: git diff --exit-code docs/coverage-badge.json docs/coverage-history.json

      # The docs site (`tools/setu_docs.py`), built here so its Coverage page is this run's `zig-out/coverage.json`;
      # published to GitHub Pages (Settings > Pages > Source: GitHub Actions; Settings > Environments > github-pages
      # allows `dev` and `main`) only from a push whose checks all passed.
      - name: Build the docs site
        if: github.event_name == 'push'
        run: '"${{ steps.py_ft.outputs.python-path }}" tools/setu_docs.py'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: zig-out/site

  pages:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
