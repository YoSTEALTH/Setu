# The wheel check's fixture (`tools/check.sh`): Setu's test extension `setu_classes` as a project that
# `tools/setu_build.py` builds wheels for. Not published (Setu's build.zig.zon leaves `test/` out).

[project]
name = "setu_classes"
description = "Setu's test extension, packaged by tools/setu_build.py for the wheel checks."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.15"
license = "CC0-1.0"
license-files = ["LICENSE.txt"]

[build-system]
requires = []
build-backend = "setu_build"
backend-path = ["tools"]

[tool.setu_build]
# `--all`: one glibc and one musl target, both ABIs (`tools/check_wheels.py` expects these four).
abis = ["cp315t", "cp315"]
targets = ["x86_64-linux-gnu.2.28", "x86_64-linux-musl"]
