# The docs check's fixture (`tool/check_doc.py`): the site of Setu's test extension `setu_class`, built with
# `tool/setu_doc.py` into `site/`. A real project has this table in its own `pyproject.toml`.

# Read for the footer only: the name links to `Homepage`, `requires-python` shows as `CPython 3.14+`.
[project]
name = 'setu_class'
version = '0.0'
requires-python = '>=3.14'
urls = { Homepage = 'https://github.com/YoSTEALTH/Setu' }

[tool.setu_doc]
module = 'setu_class'
path = ['..']
stub = '../setu_class.pyi'
summary = "Setu's test extension, as a documentation site."
home = 'doc/index.md'
css = 'doc/extra.css'
favicon = 'doc/icon.svg'
edit = 'https://github.com/YoSTEALTH/Setu/edit/dev/test/doc/'
scripts = 'example'
scripts_skip = ['forever.py']
featured = 'example/hi.py'
listen = true
hooks = 'doc_hook.py'
# a snapshot, not `zig build coverage`'s result: `example/` is the project's own folder, `setu/` a dependency
coverage = 'coverage.json'
coverage_history = 'coverage-history.json'  # three versions, by hand
# a snapshot, not `zig build profile`'s result: a source the site reads (`../function.zig`), one it does not find
profile = 'profile.json'

[[tool.setu_doc.markdown]]
file = 'doc/guide.md'
title = 'Guide'
section = 'Guide'

[[tool.setu_doc.markdown]]
file = 'doc/tour.md'
title = 'Tour'
section = 'Guide'
split = true

[[tool.setu_doc.pages]]
slug = 'functions'
title = 'Functions'
text = 'The module functions.'
sources = ['../function.zig']

[[tool.setu_doc.pages]]
slug = 'classes'
title = 'Classes'
text = 'The classes: `Vec` and friends.'
classes = ['Vec', 'Labeled', 'Ordered']

[[tool.setu_doc.pages]]
slug = 'types'
title = 'Types and exceptions'
text = 'Everything else.'
default = true

[[tool.setu_doc.pages]]
slug = 'constants'
title = 'Constants'
text = 'Grouped by prefix.'
constants = true
groups = ['K_']
