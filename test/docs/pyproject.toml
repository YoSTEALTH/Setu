# The docs check's fixture (`tools/check_docs.py`): the site of Setu's test extension `setu_classes`, built with
# `tools/setu_docs.py` into `site/`. A real project has this table in its own `pyproject.toml`.

# Read for the footer only: the name links to `Homepage`, `requires-python` shows as `CPython 3.14+`.
[project]
name = 'setu_classes'
version = '0.0'
requires-python = '>=3.14'
urls = { Homepage = 'https://github.com/YoSTEALTH/Setu' }

[tool.setu_docs]
module = 'setu_classes'
path = ['..']
stub = '../setu_classes.pyi'
summary = "Setu's test extension, as a documentation site."
home = 'docs/index.md'
css = 'docs/extra.css'
edit = 'https://github.com/YoSTEALTH/Setu/edit/dev/test/docs/'
scripts = 'example'
scripts_skip = ['forever.py']
featured = 'example/hi.py'
hooks = 'docs_hooks.py'

[[tool.setu_docs.markdown]]
file = 'docs/guide.md'
title = 'Guide'
section = 'Guide'

[[tool.setu_docs.pages]]
slug = 'functions'
title = 'Functions'
text = 'The module functions.'
sources = ['../functions.zig']

[[tool.setu_docs.pages]]
slug = 'classes'
title = 'Classes'
text = 'The classes: `Vec` and friends.'
classes = ['Vec', 'Labeled', 'Ordered']

[[tool.setu_docs.pages]]
slug = 'types'
title = 'Types and exceptions'
text = 'Everything else.'
default = true

[[tool.setu_docs.pages]]
slug = 'constants'
title = 'Constants'
text = 'Grouped by prefix.'
constants = true
groups = ['K_']
