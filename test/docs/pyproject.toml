# The docs check's fixture (`tools/check_docs.py`): the site of Setu's test extension `setu_classes`, built with
# `tools/setu_docs.py`. A real project has this table in its own `pyproject.toml`.

[tool.setu_docs]
stub = '../setu_classes.pyi'
module = 'setu_classes'

[[tool.setu_docs.pages]]
slug = 'functions'
title = 'Functions'
text = 'The module functions.'
patterns = ['.']  # every function

[[tool.setu_docs.pages]]
slug = 'classes'
title = 'Classes'
text = 'The classes: `Vec` and friends.'
classes = ['Vec', 'Labeled', 'Ordered']

[[tool.setu_docs.pages]]
slug = 'types'
title = 'Types and exceptions'
text = 'Everything else.'
default = true

[[tool.setu_docs.pages]]
slug = 'constants'
title = 'Constants'
text = 'Grouped by the prefix before the first `_`.'
constants = true
