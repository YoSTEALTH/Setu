site_name: setu_classes
docs_dir: docs
site_dir: site

theme:
  name: material

nav:
  - Home: index.md
  - API reference:
      - Overview: api/index.md
      - Functions: api/functions.md
      - Classes: api/classes.md
      - Types and exceptions: api/types.md
      - Constants: api/constants.md

plugins:
  - search
  - gen-files:
      scripts: [gen_api.py]
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            extensions:
              - ../../tools/setu_docs.py:Markdown
            docstring_style: null
            show_root_heading: true
            show_source: false
            heading_level: 2
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            show_if_no_docstring: true
